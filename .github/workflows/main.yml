
name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Files
        run: |
          test -f www/index.html
          echo "Web files verified"

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android Configuration
        run: |
          grep -R "com.islamic.daily.dairy" android/app
          test -f android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          
